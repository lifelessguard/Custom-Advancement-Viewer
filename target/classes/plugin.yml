name: CustomAdvancementViewer
version: '1.0.0'
main: com.customadvsee.CustomAdvancementViewerPlugin
api-version: '1.20'
author: Lifeless_Guard
description: Search which players have earned a given advancement and view them in a GUI.

commands:
  customadvsee:
    description: Search for players who have earned an advancement
    usage: /<command> <advancement>
    permission: customadvsee.use
    aliases: [advsee]

permissions:
  customadvsee.use:
    description: Allows use of /customadvsee
    default: op
